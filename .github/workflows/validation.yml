# Validation workflow: lints and validates the CloudFormation templates and the
# proxy code. Runs on every branch push and on pull requests.
#
# Most of these checks also run locally via pre-commit (.pre-commit-config.yaml);
# cfn-nag runs in CI only.
name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cfn-lint:
    name: cfn-lint (templates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.51.4
      - name: Lint CloudFormation
        run: cfn-lint   # uses .cfnlintrc (templates + ignore_checks)

  cfn-security:
    name: CloudFormation security (checkov + cfn-nag)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install checkov==3.2.533
      - name: Checkov (testing/ templates)
        run: checkov --config-file .checkov.yml
      # cfn-nag scans the raw template; like checkov it cannot expand the
      # AWS::LanguageExtensions transform, so it is scoped to the plain testing/
      # templates. The main stack is covered by cfn-lint.
      - name: cfn-nag (testing/ templates)
        run: |
          set -euo pipefail
          gem install cfn-nag -v 0.8.10 --user-install --no-document
          gem_user_dir="$(ruby -e 'print Gem.user_dir')"
          export PATH="${gem_user_dir}/bin:${PATH}"
          cfn_nag_scan --input-path testing

  dockerfiles:
    name: hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Lint NGINX Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: proxies/nginx/Dockerfile
      - name: Lint Envoy Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: proxies/envoy/Dockerfile

  shell:
    name: shellcheck (scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -t shell_files < <(git ls-files '*.sh')
          shellcheck --severity=warning "${shell_files[@]}"

  proxy-configs:
    name: Proxy config validation (nginx -t / envoy validate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate NGINX config
        run: |
          set -euo pipefail
          ./.github/scripts/validate-nginx.sh
      - name: Validate Envoy config
        run: |
          set -euo pipefail
          ./.github/scripts/validate-envoy.sh

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check links
        uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: .github/markdown-link-check.json
