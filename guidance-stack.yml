AWSTemplateFormatVersion: 2010-09-09
Description: (SO9403) Guidance - External Connectivity to Amazon VPC Lattice
Transform: 'AWS::LanguageExtensions'

Parameters:
  pAllowedIPv4Block:
    Description: IPv4 CIDR block for the allowed IP address range on the NLB
    Type: String
  pAllowedIPv6Block:
    Description: IPv6 CIDR block for the allowed IP address range on the NLB
    Type: String
    Default: EMPTY
  pVpcCidr:
    Type: String
    Default: 192.168.1.0/16
    Description: IPv4 CIDR block for the VPC
    AllowedPattern: "^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\\/(?:[0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: Must be a valid IPv4 CIDR block (e.g., 192.168.1.0/16)
  pProxyEngine:
    Type: String
    Default: nginx
    AllowedValues:
      - nginx
      - envoy
    Description: >-
      Proxy engine to deploy. The matching proxies/<engine>/ directory is seeded
      into the CodeCommit repository at stack creation. NGINX is the simplest
      TLS-passthrough option; Envoy provides the same passthrough behavior on a
      more extensible data plane.
  pSourceRepoUrl:
    Type: String
    Default: https://github.com/aws-solutions-library-samples/guidance-for-external-connectivity-amazon-vpc-lattice.git
    Description: >-
      Git URL used ONCE at stack creation to seed the CodeCommit repository with the selected proxy source. Point this at your own fork to bootstrap from custom code.
  pSourceRepoBranch:
    Type: String
    Default: main
    Description: Branch of SourceRepoUrl to seed the CodeCommit repository from.

Conditions:
  cIpv6Provided: !Not [!Equals [!Ref pAllowedIPv6Block, EMPTY]]

Mappings:
  # Maps each logical subnet name to its index (0-8) into the nine /24 blocks that
  # !Cidr carves out of VpcCidr, giving every subnet a deterministic, non-overlapping
  # range. The same index selects the matching IPv6 /64 from the VPC's /56.
  mSubnetCIDR:
    Position:
      PublicSubneta: 0
      PublicSubnetb: 1
      PublicSubnetc: 2
      PrivateSubneta: 3
      PrivateSubnetb: 4
      PrivateSubnetc: 5
      EndpointSubneta: 6
      EndpointSubnetb: 7
      EndpointSubnetc: 8
  # Short names for the AWS service suffix of each interface endpoint; the full
  # ServiceName (com.amazonaws.<region>.<suffix>) is assembled where the endpoints
  # are created. These are the endpoints Fargate needs to pull images, ship logs,
  # and support ECS Exec without a NAT gateway.
  mEndpoint:
    Type:
      ECRDKR: ecr.dkr
      ECRAPI: ecr.api
      Logs: logs
      SSM: ssm
      SSMMessages: ssmmessages
      EC2Messages: ec2messages

Resources:
  # ---------- AMAZON VPC RESOURCES ----------
  rVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref pVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - vpc
              - !Ref AWS::StackName

  rIPv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
        AmazonProvidedIpv6CidrBlock: true
        VpcId: !Ref rVPC

  rInternetGateway:
    Type: AWS::EC2::InternetGateway

  rInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref rVPC
      InternetGatewayId: !Ref rInternetGateway

  # For::Each iteration: per subnet type (Public, Private, Endpoint) and AZ (3 AZs)
  # Resources to create: 9 subnets, 9 route tables, 9 route table associations - obtaining AZ affinity
  'Fn::ForEach::SubnetTypes':
    - SubnetType
    - [Public, Private, Endpoint]
    - '${SubnetType}':
      'Fn::ForEach::AZ':
        - AvailabilityZone
        - [a, b, c]
          # Subnets
        - '${SubnetType}Subnet${AvailabilityZone}':
            Type: AWS::EC2::Subnet
            # Ensure the Amazon-provided IPv6 CIDR is associated to the VPC before
            # subnets evaluate !Select [0, VPC.Ipv6CidrBlocks]; otherwise the list is
            # empty and deployment fails with "Fn::Select cannot select nonexistent
            # value at index 0".
            DependsOn: rIPv6CidrBlock
            Properties:
              VpcId: !Ref rVPC
              AvailabilityZone: !Sub ${AWS::Region}${AvailabilityZone}
              # IPv4: split VpcCidr into 9 equal blocks and take this subnet's slot.
              # IPv6: split the VPC's Amazon-provided /56 into /64s and take the same slot.
              CidrBlock: !Select [!FindInMap [mSubnetCIDR, Position, 'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'], !Cidr [!Ref pVpcCidr, 9, 8 ]]
              Ipv6CidrBlock: !Select [!FindInMap [mSubnetCIDR, Position, 'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'], !Cidr [!Select [0, !GetAtt rVPC.Ipv6CidrBlocks], 9, 64 ]]
              Tags:
                - Key: Name
                  Value: !Join
                    - '-'
                    - - !Sub subnet-${SubnetType}-AZ${AvailabilityZone}
                      - !Ref AWS::StackName
          # Route Tables
          '${SubnetType}RouteTable${AvailabilityZone}':
            Type: AWS::EC2::RouteTable
            Properties:
              VpcId: !Ref rVPC
              Tags:
                - Key: Name
                  Value: !Join
                    - '-'
                    - - !Sub rt-${SubnetType}-AZ${AvailabilityZone}
                      - !Ref AWS::StackName
          # Route Table associations
          '${SubnetType}RouteTableAssociation${AvailabilityZone}':
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
              RouteTableId: !Ref
                'Fn::Sub': '${SubnetType}RouteTable${AvailabilityZone}'
              SubnetId: !Ref
                'Fn::Sub': '${SubnetType}Subnet${AvailabilityZone}'

  # For::Each iteration: per AZ (3 AZs)
  # VPC routes from public subnets to the Internet gateway
  'Fn::ForEach::VPCroutes':
    - AvailabilityZone
    - [a, b, c]
    - 'Ipv4Route${AvailabilityZone}':
        DependsOn:
          - rInternetGatewayAttachment
        Type: AWS::EC2::Route
        Properties:
          DestinationCidrBlock: 0.0.0.0/0
          RouteTableId: !Ref
            'Fn::Sub': 'PublicRouteTable${AvailabilityZone}'
          GatewayId: !Ref rInternetGateway
      'Ipv6Route${AvailabilityZone}':
        DependsOn:
          - rInternetGatewayAttachment
        Type: AWS::EC2::Route
        Properties:
          DestinationIpv6CidrBlock: ::/0
          RouteTableId: !Ref
            'Fn::Sub': 'PublicRouteTable${AvailabilityZone}'
          GatewayId: !Ref rInternetGateway

  # ---------- VPC ENDPOINTS ----------
  # For::Each iteration: per Endpoint Type
  # Interface endpoints
  'Fn::ForEach::VPCendpoints':
    - EndpointType
    - [ECRDKR, ECRAPI, Logs, SSM, SSMMessages, EC2Messages]
    - 'InterfaceEndpoint${EndpointType}':
        Type: AWS::EC2::VPCEndpoint
        Properties:
          PrivateDnsEnabled: true
          SecurityGroupIds:
            - !Ref rEndpointSecurityGroup
          ServiceName: !Join
            - '.'
            - - com.amazonaws
              - !Sub ${AWS::Region}
              - !FindInMap [mEndpoint, Type, 'Fn::Sub': '${EndpointType}']
          SubnetIds:
            - !Ref EndpointSubneta
            - !Ref EndpointSubnetb
            - !Ref EndpointSubnetc
          VpcEndpointType: Interface
          VpcId: !Ref rVPC

  # ECR stores image layers in S3, so pulling images needs an S3 path. A gateway
  # endpoint (route-table based, no ENI/hourly cost) covers it without a NAT gateway.
  rS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      RouteTableIds:
        - !Ref PrivateRouteTablea
        - !Ref PrivateRouteTableb
        - !Ref PrivateRouteTablec
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      VpcId: !Ref rVPC

  # ---------- SECURITY GROUPS ----------
  # Network Load Balancer
  rProxyNLBSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref rVPC
      GroupDescription: Proxy NLB Security Group
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Sub '${pProxyEngine}-nlb-sg'
              - !Ref AWS::StackName

  # IPv4 Ingress rule (NLB) & Egress rule (TLS-only: port 443)
  rProxyNLBSGIPv4IngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref rProxyNLBSG
      CidrIp: !Ref pAllowedIPv4Block
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  rProxyNLBSGEgressHTTPS:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref rProxyNLBSG
      DestinationSecurityGroupId: !Ref rProxyECSSG
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  # IPv6 Ingress rule (NLB) - if provided
  rProxyNLBSGIPv6IngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: cIpv6Provided
    Properties:
      GroupId: !Ref rProxyNLBSG
      CidrIpv6: !Ref pAllowedIPv6Block
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  # ECS Cluster
  rProxyECSSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref rVPC
      GroupDescription: Proxy (ECS) Security group
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Sub '${pProxyEngine}-ecs-sg'
              - !Ref AWS::StackName

  # ECS ingress rule from the NLB (TLS-only: port 443)
  rProxyECSSGIngressHTTPS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref rProxyECSSG
      SourceSecurityGroupId: !Ref rProxyNLBSG
      IpProtocol: 'tcp'
      FromPort: 443
      ToPort: 443

  # VPC endpoints
  rEndpointSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref rVPC
      GroupDescription: VPC Endpoint Security Group
      SecurityGroupIngress:
        - CidrIp: !Ref pVpcCidr
          IpProtocol: 'tcp'
          FromPort: 443
          ToPort: 443
          Description: Ingress rule for HTTPS
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: '-1'
      Tags:
        - Key: Name
          Value: !Join
            - '-'
            - - !Sub endpoint-sg
              - !Ref AWS::StackName

  # ---------- NETWORK LOAD BALANCER ----------
  rProxyNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      IpAddressType: dualstack
      Scheme: internet-facing
      Type: network
      SecurityGroups:
        - !Ref rProxyNLBSG
      Subnets:
        - !Ref PublicSubneta
        - !Ref PublicSubnetb
        - !Ref PublicSubnetc

  # Target Group: 443
  rProxyNLBTGroupHTTPS:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      # Aggressive health checks (5s interval, 2s timeout, 3 checks) so an unhealthy
      # task is rotated out, and a new one brought in, quickly under autoscaling.
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 2
      HealthyThresholdCount: 3
      IpAddressType: ipv4
      Port: 443
      Protocol: TCP
      TargetGroupAttributes:
        # The NLB does TLS passthrough, so the proxy never sees the client IP at the
        # TCP layer. PROXY protocol v2 prepends the real client IP/port, which nginx
        # (proxy_protocol) and Envoy (proxy_protocol listener filter) parse back out.
        - Key: proxy_protocol_v2.enabled
          Value: true
      TargetType: ip
      UnhealthyThresholdCount: 3
      VpcId: !Ref rVPC

  # Listener: 443
  rProxyNLBListenerHTTPS:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref rProxyNLBTGroupHTTPS
          Type: forward
      LoadBalancerArn: !Ref rProxyNLB
      Port: 443
      Protocol: TCP

  # ---------- AMAZON ECR REPOSITORY ----------
  rLatticeExternalConnectivityECRRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true

  # ---------- CODECOMMIT (proxy source of truth) ----------
  # Seeded once at stack creation from SourceRepoUrl with the selected proxy engine.
  # After deployment this is the user-editable source: a commit triggers the pipeline.
  # Retained on stack deletion so proxy customizations committed here are not lost.
  rProxySourceRepo:
    Type: AWS::CodeCommit::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-${pProxyEngine}-source'
      RepositoryDescription: !Sub 'Editable proxy source for ${AWS::StackName}. Commits trigger build and deploy.'

  # ---------- ECS CLUSTER ----------
  rProxyCluster:
    Type: 'AWS::ECS::Cluster'
    Properties:
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ECS Task
  # Initial task definition references the image built by the bootstrap stage
  # (tag: bootstrap). Subsequent deploys are driven by CodePipeline's ECS deploy
  # action, which registers new task-def revisions with immutable commit-based tags.
  rProxyTask:
    DependsOn:
      - rProxyBootstrapCustomResource
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      ExecutionRoleArn: !GetAtt rProxyTaskExecRole.Arn
      NetworkMode: awsvpc
      ContainerDefinitions:
        - Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${rLatticeExternalConnectivityECRRepo}:bootstrap"
          Name: Proxy
          PortMappings:
            - ContainerPort: 443
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref rProxyLogGroup
              awslogs-stream-prefix: lattice-externalconnectivity
          Ulimits:
            # Raise the open-file-descriptor limit well above the default 1024 so the
            # proxy can sustain a high number of concurrent connections.
            - HardLimit: 1048576
              Name: nofile
              SoftLimit: 1048576
      Cpu: 2048
      Memory: 4096
      RequiresCompatibilities:
        - FARGATE
      # ARM64 (Graviton) for better price/performance. The images are built ARM64 to
      # match (CodeBuild ARM_CONTAINER), so this must stay aligned with the build.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !GetAtt rProxyTaskRole.Arn

  # ECS Service
  rProxyService:
    Type: 'AWS::ECS::Service'
    DependsOn:
      - rProxyNLBListenerHTTPS
    Properties:
      Cluster: !Ref rProxyCluster
      # Enables ECS Exec (interactive shell into a task) for debugging; relies on the
      # ssmmessages permissions granted to the task and task-execution roles below.
      EnableExecuteCommand: true
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: Proxy
          ContainerPort: 443
          TargetGroupArn: !Ref rProxyNLBTGroupHTTPS
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref rProxyECSSG
          Subnets:
            - !Ref PrivateSubneta
            - !Ref PrivateSubnetb
            - !Ref PrivateSubnetc
      SchedulingStrategy: REPLICA
      TaskDefinition: !Ref rProxyTask

  # ECS Task Execution Role
  rProxyTaskExecRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: ecs-actions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # ECR pull: image-layer actions scoped to this repo; only the auth
              # token call requires "*" (it does not support resource scoping).
              - Effect: Allow
                Action:
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${rLatticeExternalConnectivityECRRepo}'
              - Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'
              # Container log delivery, scoped to the proxy log group.
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${rProxyCluster}:*'
              # ECS Exec (SSM messages) requires "*" - these actions do not support
              # resource-level scoping.
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # ECS Task Role
  rProxyTaskRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: ecs-actions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # ECS Exec (SSM messages) requires "*" - these actions do not support
              # resource-level scoping.
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # CloudWatch Log Group
  rProxyLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: !Sub '/${rProxyCluster}'
      RetentionInDays: 90

  # AutoScaling - Scalable Target
  rProxyScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 9
      MinCapacity: 3
      ResourceId: !Join ['',['service/',!Ref rProxyCluster,'/',!GetAtt rProxyService.Name]]
      # RoleARN is intentionally omitted: Application Auto Scaling uses the
      # AWSServiceRoleForApplicationAutoScaling_ECSService service-linked role
      # automatically (created on first use).
      ScalableDimension: 'ecs:service:DesiredCount'
      ServiceNamespace: 'ecs'

  # AutoScaling Policy
  rProxyScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Join ['',['scaling-policy-',!GetAtt rProxyService.Name]]
      PolicyType: 'TargetTrackingScaling'
      ScalingTargetId: !Ref rProxyScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # ========== CI/CD PIPELINE ==========
  # Once running, you edit the proxy by committing to CodeCommit. Each commit flows
  # through the pipeline:
  #   1. Source  (CodePipeline) picks up the commit from CodeCommit.
  #   2. Build   (CodeBuild) builds the image, tags it with the commit ID, pushes it
  #              to ECR, and writes imagedefinitions.json for the deploy stage.
  #   3. Deploy  (ECS) does a rolling update of the service to the new image.
  #
  # Before any of that can run, the bootstrap stage (a custom resource, further below)
  # seeds CodeCommit from SourceRepoUrl and builds the initial ':bootstrap' image, so
  # the ECS service has something to start from on first creation.

  # ---------- PIPELINE ARTIFACT BUCKET ----------
  rPipelineArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ---------- BOOTSTRAP (seed CodeCommit + build initial image) ----------
  rBootstrapProjectRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${pProxyEngine}-bootstrap'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${pProxyEngine}-bootstrap:*'
        - PolicyName: CodeCommitSeed
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codecommit:GetRepository
                  - codecommit:GetBranch
                  - codecommit:GitPull
                  - codecommit:GitPush
                Resource: !GetAtt rProxySourceRepo.Arn
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${rLatticeExternalConnectivityECRRepo}'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'

  rBootstrapProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-${pProxyEngine}-bootstrap'
      Description: 'Seed CodeCommit from SourceRepoUrl and build the initial proxy image'
      ServiceRole: !GetAtt rBootstrapProjectRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY
            Value: !Ref rLatticeExternalConnectivityECRRepo
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: CC_REPO_NAME
            Value: !GetAtt rProxySourceRepo.Name
          - Name: CC_BRANCH
            Value: !Ref pSourceRepoBranch
          - Name: SOURCE_REPO_URL
            Value: !Ref pSourceRepoUrl
          - Name: SOURCE_REPO_BRANCH
            Value: !Ref pSourceRepoBranch
          - Name: PROXY_ENGINE
            Value: !Ref pProxyEngine
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - pip install --quiet git-remote-codecommit
            build:
              commands:
                - |
                  set -euo pipefail
                  if aws codecommit get-branch --repository-name "$CC_REPO_NAME" --branch-name "$CC_BRANCH" >/dev/null 2>&1; then
                    echo "CodeCommit repo '$CC_REPO_NAME' already has branch '$CC_BRANCH'; skipping seed (preserving user edits)."
                  else
                    echo "Seeding CodeCommit repo '$CC_REPO_NAME' (branch '$CC_BRANCH') from $SOURCE_REPO_URL@$SOURCE_REPO_BRANCH, engine '$PROXY_ENGINE'"
                    if ! git clone --depth 1 --branch "$SOURCE_REPO_BRANCH" "$SOURCE_REPO_URL" /tmp/src; then
                      echo "ERROR: failed to clone $SOURCE_REPO_URL (branch $SOURCE_REPO_BRANCH)."
                      echo "       Check SourceRepoUrl/SourceRepoBranch are correct and the branch is publicly reachable."
                      exit 1
                    fi
                    if [ ! -d "/tmp/src/proxies/$PROXY_ENGINE" ]; then
                      echo "ERROR: directory 'proxies/$PROXY_ENGINE' not found in $SOURCE_REPO_URL@$SOURCE_REPO_BRANCH."
                      echo "       Ensure the proxy engine '$PROXY_ENGINE' exists at that path on that branch."
                      exit 1
                    fi
                    mkdir -p /tmp/seed
                    cp -a "/tmp/src/proxies/$PROXY_ENGINE/." /tmp/seed/
                    cd /tmp/seed
                    git init -b "$CC_BRANCH"
                    git config user.email "bootstrap@guidance.local"
                    git config user.name "stack-bootstrap"
                    git remote add origin "codecommit::$AWS_REGION://$CC_REPO_NAME"
                    git add .
                    git commit -m "Initial seed: $PROXY_ENGINE proxy from $SOURCE_REPO_URL@$SOURCE_REPO_BRANCH"
                    git push origin "$CC_BRANCH"
                    echo "Seed complete: pushed proxies/$PROXY_ENGINE to '$CC_REPO_NAME' branch '$CC_BRANCH'."
                  fi
            post_build:
              commands:
                - |
                  set -euo pipefail
                  echo "Building initial ':bootstrap' image for engine '$PROXY_ENGINE'"
                  aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
                  rm -rf /tmp/cc
                  git clone --depth 1 "codecommit::$AWS_REGION://$CC_REPO_NAME" /tmp/cc
                  cd /tmp/cc
                  if ! docker build -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:bootstrap" .; then
                    echo "ERROR: docker build failed. If this is the Envoy engine, a Docker Hub pull-rate"
                    echo "       limit ('toomanyrequests') is a common cause - see proxies/envoy/."
                    exit 1
                  fi
                  docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:bootstrap"
                  echo "Pushed ':bootstrap' image to $ECR_REPOSITORY."
      TimeoutInMinutes: 12

  # Lambda-backed custom resource: runs the bootstrap build on stack create and waits
  # until the ':bootstrap' image exists in ECR before the ECS service is created.
  rBootstrapLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: BootstrapControl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt rBootstrapProject.Arn

  rBootstrapLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt rBootstrapLambdaRole.Arn
      Runtime: python3.12
      Timeout: 900
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info('Received event: %s', json.dumps(event))
              physical_id = event.get('PhysicalResourceId') or 'proxy-bootstrap'

              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                  return

              props = event['ResourceProperties']
              project_name = props['ProjectName']

              try:
                  codebuild = boto3.client('codebuild')
                  build_id = codebuild.start_build(projectName=project_name)['build']['id']
                  logger.info('Bootstrap build started: %s', build_id)

                  # Poll until the build finishes, leaving headroom before Lambda timeout.
                  deadline = time.time() + 840
                  status = 'IN_PROGRESS'
                  while status == 'IN_PROGRESS' and time.time() < deadline:
                      time.sleep(15)
                      status = codebuild.batch_get_builds(ids=[build_id])['builds'][0]['buildStatus']

                  logger.info('Bootstrap build status: %s', status)
                  if status == 'SUCCEEDED':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                       {'BuildId': build_id}, physical_id)
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED,
                                       {'Reason': f'Bootstrap build {build_id} status: {status}'},
                                       physical_id)
              except Exception as e:
                  logger.exception('Bootstrap failed')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, physical_id)

  rProxyBootstrapCustomResource:
    Type: Custom::ProxyBootstrap
    DependsOn:
      - rProxySourceRepo
    Properties:
      ServiceToken: !GetAtt rBootstrapLambda.Arn
      ProjectName: !Ref rBootstrapProject

  # ---------- IMAGE BUILD (pipeline build stage) ----------
  rImageBuildProjectRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${pProxyEngine}-image-build'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-${pProxyEngine}-image-build:*'
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${rLatticeExternalConnectivityECRRepo}'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
        - PolicyName: ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub '${rPipelineArtifactBucket.Arn}/*'

  rImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-${pProxyEngine}-image-build'
      Description: 'Build and push the proxy image from CodeCommit source (pipeline build stage)'
      ServiceRole: !GetAtt rImageBuildProjectRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY
            Value: !Ref rLatticeExternalConnectivityECRRepo
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: CONTAINER_NAME
            Value: Proxy
      Source:
        Type: CODEPIPELINE
        # buildspec.yml is provided by the CodeCommit source (proxies/<engine>/buildspec.yml)
      TimeoutInMinutes: 15

  # ---------- CODEPIPELINE ----------
  rPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt rPipelineArtifactBucket.Arn
                  - !Sub '${rPipelineArtifactBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                Resource: !GetAtt rProxySourceRepo.Arn
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt rImageBuildProject.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt rProxyTaskExecRole.Arn
                  - !GetAtt rProxyTaskRole.Arn
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  rProxyPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt rPipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref rPipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: !GetAtt rProxySourceRepo.Name
                BranchName: !Ref pSourceRepoBranch
                # Polling disabled on purpose: the PipelineTriggerRule (EventBridge)
                # starts the pipeline on each commit, which is faster than polling.
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref rImageBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: '1'
              Configuration:
                ClusterName: !Ref rProxyCluster
                ServiceName: !GetAtt rProxyService.Name
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildOutput

  # EventBridge rule: trigger the pipeline on commits to the tracked branch.
  rPipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${rProxyPipeline}'

  rPipelineTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub 'Trigger ${AWS::StackName} proxy pipeline on CodeCommit commits'
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt rProxySourceRepo.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref pSourceRepoBranch
      Targets:
        - Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${rProxyPipeline}'
          Id: ProxyPipeline
          RoleArn: !GetAtt rPipelineTriggerRole.Arn

Outputs:
  oVpcId:
    Description: Ingress VPC ID
    Value: !Ref rVPC
  oNLBDomainName:
    Description: NLB Domain Name
    Value: !GetAtt rProxyNLB.DNSName
  oNLBHostedZoneId:
    Description: NLB Hosted Zone ID
    Value: !GetAtt rProxyNLB.CanonicalHostedZoneID
  oProxySourceRepoCloneUrlHttp:
    Description: HTTPS clone URL for the editable proxy source (CodeCommit). Commits trigger the pipeline.
    Value: !GetAtt rProxySourceRepo.CloneUrlHttp
  oProxySourceRepoName:
    Description: CodeCommit repository name for the proxy source
    Value: !GetAtt rProxySourceRepo.Name
  oProxyPipelineName:
    Description: CodePipeline that builds and deploys proxy changes
    Value: !Ref rProxyPipeline
  oECRRepositoryName:
    Description: ECR repository holding the proxy images
    Value: !Ref rLatticeExternalConnectivityECRRepo
  oProxyTaskDefinitionArn:
    Description: Proxy ECS Task Definition ARN
    Value: !Ref rProxyTask
  oProxyLogGroupName:
    Description: Proxy CloudWatch Log Group Name
    Value: !Ref rProxyLogGroup
  oProxyScalingPolicyArn:
    Description: Proxy Application Auto Scaling Policy ARN
    Value: !Ref rProxyScalingPolicy
